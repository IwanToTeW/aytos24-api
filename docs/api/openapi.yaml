openapi: 3.1.0

info:
  title: Aytos24 API
  version: 1.0.0
  summary: Public REST API for Aytos24, the local platform for Aytos, Bulgaria.
  description: |
    The Aytos24 API powers meal-first food discovery: users browse today's
    lunch meals from all participating restaurants in Aytos, filter by
    category, search for dishes and compare prices, without any restaurant
    being favoured.

    ## Conventions

    - **Versioning.** Every public endpoint lives under `/api/v1/`. Breaking
      changes are only introduced under a new version prefix. Within `v1`,
      new fields may be added to responses, so clients must ignore unknown
      properties.
    - **Format.** Requests and responses use JSON (`application/json`,
      UTF-8). Clients should send `Accept: application/json`; with it,
      every response, including errors, is JSON.
    - **Field naming.** Property names and query parameters use `snake_case`.
    - **Nullable fields.** A nullable field is always present in the response
      with a `null` value; it is never omitted.
    - **Content language.** Meal, category and restaurant text is returned as
      entered by restaurants (normally Bulgarian, Cyrillic). It is not
      translated by the API.

    ## Authentication

    Food discovery endpoints (tag `Meals`) are public and read-only. No
    authentication is required, and no credentials, cookies or API keys
    should be sent to them.

    Customer authentication (tags `Authentication`, `Social authentication`
    and `Profile`) is described in full in `docs/api/authentication.md`.
    Browser clients use Laravel Sanctum's cookie-based session
    (`browserSession`); future native clients will use Sanctum bearer tokens
    (`nativeToken`). Both identify the same customer account.

    ## Implementation status

    Every operation carries `x-implementation-status`: `implemented` means
    the endpoint is live; `contract-only` means the contract is agreed but
    the endpoint does not exist yet (`x-implemented-in` names the ticket that
    delivers it). Clients must not call `contract-only` endpoints.

    ## Prices

    All prices are in euro (EUR), Bulgaria's currency since 1 January 2026.
    Prices are represented as an integer number of **euro cents** together
    with an ISO 4217 currency code, for example `{"amount": 690, "currency":
    "EUR"}` for €6.90. Floating-point values are never used for money.
    Formatting for display (for example `6,90 €` in Bulgarian) is the
    client's responsibility, e.g. with `Intl.NumberFormat`.

    ## Dates, times and restaurant time zones

    Each restaurant has an IANA time zone (currently `Europe/Sofia` for every
    restaurant in Aytos). "Today" for a meal means the current calendar date
    in its restaurant's time zone, not the server's or the client's.
    Date-only values use `YYYY-MM-DD`. Timestamps use RFC 3339 with the
    restaurant's UTC offset, for example `2026-10-09T11:30:00+03:00`
    (summer) or `2026-12-01T11:30:00+02:00` (winter).

    ## Errors

    Every error response has a human-readable `message`. Validation errors
    additionally list the invalid fields under `errors`. Server errors never
    expose stack traces, exception names, SQL or other internal details.

    ## Rate limiting

    Public endpoints are limited to **60 requests per minute per client IP
    address**. Each response carries `X-RateLimit-Limit` and
    `X-RateLimit-Remaining` headers. When the limit is exceeded the API
    responds with `429 Too Many Requests` and a `Retry-After` header giving
    the number of seconds to wait. Authentication endpoints have additional,
    stricter limits listed in `docs/api/authentication.md`.
  contact:
    name: Aytos24

servers:
  - url: http://localhost:8000/api
    description: Local Docker development environment

security: []

tags:
  - name: Meals
    description: Daily lunch menu discovery across all participating restaurants.
  - name: Authentication
    description: Customer registration, sign-in, sessions, email verification and password recovery.
  - name: Social authentication
    description: Backend-controlled sign-in with Google, Facebook and Apple (browser navigations, not XHR).
  - name: Profile
    description: The authenticated customer's own profile.

paths:
  /v1/meals/today:
    get:
      tags: [Meals]
      operationId: listTodayMeals
      x-implementation-status: implemented
      summary: List today's lunch meals
      description: |
        Returns a paginated list of the lunch meals offered today by all
        participating restaurants. The endpoint is public, read-only and
        requires no authentication.

        ## Availability rules

        A meal is included only when **all** of the following are true:

        1. It is on its restaurant's daily menu for today, where "today" is
           the current date in the restaurant's time zone (`available_on`
           equals that date).
        2. The meal is active (not withdrawn by the restaurant).
        3. Its restaurant is active on Aytos24.
        4. Its category is active.

        Meals stay in the list for the **whole local calendar day**, even
        after their serving window (`served_until`) has passed. This keeps
        pagination stable during the day; clients can use `served_from` and
        `served_until` to show whether a meal is currently being served. At
        local midnight the list switches to the next day's menus.

        ## Inactive and unknown categories

        Meals whose category is inactive are excluded from every response,
        with or without a `category` filter. Filtering by a category slug
        that is inactive or does not exist is not an error: the response is
        `200` with an empty `data` array. Only a syntactically invalid slug
        returns `422`.

        ## Search

        `search` is trimmed and then matched case-insensitively as a single
        substring against each meal's `name` and `description`. A meal
        matches if either field contains the term. Cyrillic and Latin input
        are both supported; there is no transliteration, so `musaka` does not
        match `Мусака`. An empty or whitespace-only value is treated as if
        the parameter were absent.

        `category` and `search` may be combined; a meal must satisfy both.

        ## Neutral restaurant ordering

        Results are ordered so that no restaurant is consistently favoured,
        and so that restaurants with many dishes do not crowd out those with
        few. After filtering, meals are ordered by:

        1. **Round-robin rank.** Each restaurant's matching meals are ranked
           1, 2, 3… in the restaurant's own menu order (menu position, then
           meal `id`). All rank-1 meals come first, then all rank-2 meals,
           and so on, so page 1 shows one dish from as many restaurants as
           possible.
        2. **Daily restaurant rotation.** Within the same rank, restaurants
           are ordered by `SHA-256("{restaurant_id}:{YYYY-MM-DD}")` (the
           lowercase hex digest, compared as a string) using the local date.
           This shuffles restaurants deterministically, so the order changes
           every day but is stable for the whole day.
        3. **Meal `id`**, ascending, as a final tie-breaker.

        The order is identical for every client, does not depend on
        payment, popularity or any other per-restaurant setting, and is
        stable across pages for a given date and filter combination.
        Clients must not rely on any particular order beyond these
        guarantees. Sorting by price is not supported in v1.

        ## Pagination

        Results are paginated with `page` and `per_page`. A `page` beyond
        the last page returns `200` with an empty `data` array and accurate
        `meta`. When there are no results, `total` is `0` and `last_page` is
        `1`.

        ## Validation rules

        | Parameter | Rules |
        | --- | --- |
        | `category` | optional; string; 1–100 characters; lowercase slug matching `^[a-z0-9]+(?:-[a-z0-9]+)*$` |
        | `search` | optional; string; 2–100 characters after trimming; empty or whitespace-only is ignored |
        | `page` | optional; integer; minimum 1; default 1 |
        | `per_page` | optional; integer; 1–50; default 20 |

        Unknown query parameters are ignored. Any rule violation returns
        `422` listing every invalid parameter.
      parameters:
        - $ref: '#/components/parameters/CategoryFilter'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: |
            Today's meals matching the filters. An empty result is still a
            successful `200` response.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MealCollection'
              examples:
                today:
                  summary: First page of today's meals
                  value:
                    data:
                      - id: 1042
                        name: Пилешка супа
                        description: Домашна пилешка супа с фиде и застройка.
                        portion: 350 мл
                        price:
                          amount: 350
                          currency: EUR
                        image_url: null
                        available_on: '2026-10-09'
                        served_from: '2026-10-09T11:30:00+03:00'
                        served_until: '2026-10-09T15:00:00+03:00'
                        category:
                          id: 1
                          slug: soups
                          name: Супи
                        restaurant:
                          id: 7
                          slug: bistro-aetos
                          name: Бистро Аетос
                          address: ул. Цар Освободител 12, Айтос
                          logo_url: null
                          timezone: Europe/Sofia
                      - id: 1108
                        name: Мусака
                        description: Класическа мусака с картофи и кайма.
                        portion: 400 г
                        price:
                          amount: 690
                          currency: EUR
                        image_url: http://localhost:8000/storage/meals/1108.jpg
                        available_on: '2026-10-09'
                        served_from: '2026-10-09T12:00:00+03:00'
                        served_until: '2026-10-09T14:30:00+03:00'
                        category:
                          id: 2
                          slug: main-dishes
                          name: Основни ястия
                        restaurant:
                          id: 3
                          slug: mehana-chinarite
                          name: Механа Чинарите
                          address: null
                          logo_url: http://localhost:8000/storage/restaurants/3/logo.png
                          timezone: Europe/Sofia
                      - id: 1077
                        name: Шопска салата
                        description: null
                        portion: 300 г
                        price:
                          amount: 420
                          currency: EUR
                        image_url: null
                        available_on: '2026-10-09'
                        served_from: null
                        served_until: null
                        category:
                          id: 3
                          slug: salads
                          name: Салати
                        restaurant:
                          id: 5
                          slug: restorant-tsentral
                          name: Ресторант Централ
                          address: пл. Свобода 1, Айтос
                          logo_url: null
                          timezone: Europe/Sofia
                    meta:
                      current_page: 1
                      per_page: 20
                      total: 3
                      last_page: 1
                empty:
                  summary: No meals match (or no menus published yet today)
                  value:
                    data: []
                    meta:
                      current_page: 1
                      per_page: 20
                      total: 0
                      last_page: 1
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /sanctum/csrf-cookie:
    servers:
      - url: http://localhost:8000
        description: Application root. This Sanctum route is not under /api and not versioned.
    get:
      tags: [Authentication]
      operationId: initializeCsrfProtection
      x-implementation-status: implemented
      x-implemented-in: BE-006
      summary: Initialise CSRF protection (browser only)
      description: |
        Provided by Laravel Sanctum; it is **not** part of the versioned API.
        Browser clients call it once before their first state-changing
        request (and again after a `419`). It starts a session and sets the
        `XSRF-TOKEN` cookie, whose value the client sends back in the
        `X-XSRF-TOKEN` header. Native clients never call it.

        Rate limit: 60 requests per minute per IP address (each call can
        create a database session row).
      security: []
      responses:
        '204':
          description: Session and `XSRF-TOKEN` cookies set. No body.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/Set-Cookie'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /v1/auth/register:
    post:
      tags: [Authentication]
      operationId: registerCustomer
      x-implementation-status: implemented
      x-implemented-in: BE-006
      summary: Register a customer with email and password
      description: |
        Creates an unverified customer and queues the email verification
        link. **Nobody is signed in** (verification-first policy, amended in
        FE-008): no session is started, no remember-me cookie and no token
        are issued, and an existing session is left unchanged. The customer
        signs in with `POST /v1/auth/login` after verifying the email.

        Duplicate emails are reported (`422` on `email`): registration is the
        one place where the existence of an account is revealed, mitigated by
        rate limiting. Emails are trimmed and lowercased before the
        uniqueness check.

        Rate limit: 10 requests per hour per IP address.
      security: []
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              register:
                summary: New customer
                value:
                  name: Ivan
                  email: ivan@example.com
                  password: ExamplePassword123!
                  password_confirmation: ExamplePassword123!
      responses:
        '201':
          description: Customer created, not signed in. The verification email has been queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationAccepted'
              examples:
                registered:
                  summary: Verify the email before signing in
                  value:
                    message: Your account has been created. Check your email and verify your address before signing in.
                    verification_required: true
        '419':
          $ref: '#/components/responses/CsrfTokenMismatch'
        '422':
          description: Validation failed. `errors` names every invalid field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              examples:
                emailTaken:
                  summary: Email already registered
                  value:
                    message: The email has already been taken.
                    errors:
                      email:
                        - The email has already been taken.
                multipleFields:
                  summary: Several invalid fields
                  value:
                    message: The name field is required. (and 2 more errors)
                    errors:
                      name:
                        - The name field is required.
                      email:
                        - The email field must be a valid email address.
                      password:
                        - The password field confirmation does not match.
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'

  /v1/auth/login:
    post:
      tags: [Authentication]
      operationId: loginCustomer
      x-implementation-status: implemented
      x-implemented-in: BE-007
      summary: Sign in with email and password
      description: |
        Authenticates the customer and starts a browser session. The session
        ID and CSRF token are regenerated. With `remember: true` a long-lived
        remember-me cookie keeps the customer signed in after the idle
        session expires.

        Wrong email, wrong password, an unknown email and a social-only
        account without a password all produce the **same** `422` response,
        so the endpoint does not reveal whether an account exists.

        Verification-first policy (amended in FE-008): correct credentials
        of a customer whose email is not verified get `403` with
        `code: EMAIL_NOT_VERIFIED` and **no session**. This status is only
        ever returned for the correct password, so it reveals nothing to
        someone who does not know it.

        If the request already carries an authenticated session, that
        customer is signed out first.

        Requests that are not from the web app (no stateful `Origin`/`Referer`)
        are only validated: the same `200`/`403`/`422`, but no session and no token,
        because native token issuance is not implemented yet.

        Rate limit: 5 failed attempts per minute per email and IP address
        combination, and 20 requests per minute per IP address.
      security: []
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              login:
                summary: Email and password
                value:
                  email: ivan@example.com
                  password: ExamplePassword123!
              remembered:
                summary: Stay signed in on this device
                value:
                  email: ivan@example.com
                  password: ExamplePassword123!
                  remember: true
      responses:
        '200':
          description: Signed in.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/Set-Cookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResource'
              examples:
                signedIn:
                  summary: Signed-in customer
                  value:
                    data:
                      id: 123
                      name: Ivan
                      email: ivan@example.com
                      email_verified: true
                      phone: null
                      created_at: '2026-10-10T09:00:00Z'
        '403':
          description: |
            The credentials are correct but the email is not verified yet. No
            session is started. Clients branch on `code`, not on the message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailNotVerified'
              examples:
                unverified:
                  summary: Email not verified
                  value:
                    message: Verify your email address before signing in.
                    code: EMAIL_NOT_VERIFIED
        '419':
          $ref: '#/components/responses/CsrfTokenMismatch'
        '422':
          description: |
            Validation failed, or the credentials are invalid. Invalid
            credentials are always reported on `email`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              examples:
                invalidCredentials:
                  summary: Wrong email or password (identical for unknown accounts)
                  value:
                    message: These credentials do not match our records.
                    errors:
                      email:
                        - These credentials do not match our records.
                missingPassword:
                  summary: Missing field
                  value:
                    message: The password field is required.
                    errors:
                      password:
                        - The password field is required.
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'

  /v1/auth/logout:
    post:
      tags: [Authentication]
      operationId: logoutCustomer
      x-implementation-status: implemented
      x-implemented-in: BE-007
      summary: Sign out of the current session or device
      description: |
        Browser session: signs out, invalidates the session, regenerates the
        CSRF token and expires the remember-me cookie. Other browsers and
        devices of the same customer stay signed in (the remember-me token is
        not cycled). Native tokens (future) will revoke only the token used
        for the request; no tokens are issued yet.

        Clients should treat a `401` from this endpoint as "already signed
        out".
      security:
        - browserSession: []
        - nativeToken: []
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      responses:
        '204':
          description: Signed out. No body.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/Set-Cookie'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '419':
          $ref: '#/components/responses/CsrfTokenMismatch'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'

  /v1/auth/user:
    get:
      tags: [Authentication]
      operationId: getAuthenticatedCustomer
      x-implementation-status: implemented
      x-implemented-in: BE-007
      summary: Get the authenticated customer
      description: |
        Returns the signed-in customer. The web app calls it on start-up to
        restore the session; a `401` means "not signed in" and is not an
        error to report. Identical in shape to `GET /v1/me`.

        Only verified customers are signed in. A session of a customer whose
        email is not verified (e.g. started before the verification-first
        policy) is ended and answered `401`, like any signed-out request.
      security:
        - browserSession: []
        - nativeToken: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          $ref: '#/components/responses/Customer'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'

  /v1/auth/forgot-password:
    post:
      tags: [Authentication]
      operationId: requestPasswordReset
      x-implementation-status: implemented
      x-implemented-in: BE-009
      summary: Request a password reset email
      description: |
        If the email belongs to a customer with a password, a link to the
        web app's reset page, valid for 60 minutes, is emailed (at most one
        per account per 60 seconds). The response is **identical** for
        known, unknown and social-only (no password) emails, during the
        per-account cooldown, and when the email could not be queued. It
        never says whether an email was sent; the reset token is never
        returned.

        Social-only customers get no email and no token; this endpoint
        never creates a password for them (BE-011).

        Rate limit: 20 requests per hour per IP address, whatever the email.
      security: []
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
            examples:
              forgot:
                summary: Request a reset link
                value:
                  email: ivan@example.com
      responses:
        '200':
          description: Request accepted. The same body for every valid email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              examples:
                accepted:
                  summary: Known and unknown emails alike
                  value:
                    message: If an account exists for this email address, a password reset link will be sent.
        '419':
          $ref: '#/components/responses/CsrfTokenMismatch'
        '422':
          description: The email is missing or malformed. Never reports unknown accounts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              examples:
                invalidEmail:
                  summary: Malformed email
                  value:
                    message: The email field must be a valid email address.
                    errors:
                      email:
                        - The email field must be a valid email address.
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'

  /v1/auth/reset-password:
    post:
      tags: [Authentication]
      operationId: resetPassword
      x-implementation-status: implemented
      x-implemented-in: BE-009
      summary: Set a new password with a reset token
      description: |
        Sets a new password using the token from the reset email. The token
        is single-use and expires 60 minutes after it was issued. A
        successful reset deletes the token and rotates the remember-me
        token; other browser sessions of the customer end on their next
        request. The customer is **not** signed in and no token is issued;
        the client sends them to the sign-in page.

        Invalid, expired and already-used tokens, and tokens that do not
        belong to the given email (including unknown emails), all produce the
        same `422` error on `token`.

        Rate limit: 5 requests per minute per IP address.
      security: []
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
            examples:
              reset:
                summary: New password
                value:
                  email: ivan@example.com
                  token: reset-token
                  password: NewExamplePassword123!
                  password_confirmation: NewExamplePassword123!
      responses:
        '200':
          description: Password changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              examples:
                reset:
                  summary: Password changed
                  value:
                    message: Your password has been reset successfully.
        '419':
          $ref: '#/components/responses/CsrfTokenMismatch'
        '422':
          description: Validation failed, or the token is invalid or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              examples:
                invalidToken:
                  summary: Invalid, expired or used token
                  value:
                    message: The password reset link is invalid or has expired.
                    errors:
                      token:
                        - The password reset link is invalid or has expired.
                weakPassword:
                  summary: Password policy not met
                  value:
                    message: The password field must be at least 8 characters.
                    errors:
                      password:
                        - The password field must be at least 8 characters.
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'

  /v1/auth/verify-email/{id}/{hash}:
    get:
      tags: [Authentication]
      operationId: verifyEmail
      x-implementation-status: implemented
      x-implemented-in: BE-006
      summary: Verify an email address (signed link from the email)
      description: |
        Opened by the customer from the verification email, in any browser
        and without being signed in. It is a browser navigation, not an XHR
        call: it never returns JSON for the outcome, but always redirects to
        the frontend at `{FRONTEND_URL}/email-verified?status=<status>`.

        | `status` | Meaning |
        | --- | --- |
        | `verified` | The email is now verified. |
        | `already-verified` | It was verified before; nothing changed. |
        | `expired` | The link is older than 24 hours. Sign in and request a new one. |
        | `invalid` | Bad signature, unknown customer, or the email changed since the link was sent. |

        The link never signs the customer in.
      security: []
      parameters:
        - name: id
          in: path
          required: true
          description: Customer ID.
          schema:
            type: integer
            minimum: 1
          example: 123
        - name: hash
          in: path
          required: true
          description: SHA-1 hex digest of the customer's email address at the time the link was sent.
          schema:
            type: string
            pattern: '^[a-f0-9]{40}$'
          example: 9f0d4c3b5c0f0a4f5d3e1e8a7b2c6d9e0f1a2b3c
        - name: expires
          in: query
          required: true
          description: Expiry of the signed link (Unix timestamp).
          schema:
            type: integer
          example: 1791709200
        - name: signature
          in: query
          required: true
          description: HMAC signature of the URL generated by Laravel.
          schema:
            type: string
            pattern: '^[a-f0-9]{64}$'
          example: 4f1c0a6a0e2b7d1c9e3f5a7b9c1d3e5f7a9b1c3d5e7f9a1b3c5d7e9f1a3b5c7d
      responses:
        '302':
          description: Redirect to the frontend with the outcome in `status`.
          headers:
            Location:
              $ref: '#/components/headers/Location'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /v1/auth/email/verification-notification:
    post:
      tags: [Authentication]
      operationId: resendVerificationEmail
      x-implementation-status: implemented
      x-implemented-in: BE-006
      summary: Resend the email verification link
      description: |
        Guest endpoint (amended in FE-008: unverified customers cannot sign
        in). If the email belongs to a customer whose email is not verified,
        a new verification link is queued — at most one per account per
        60 seconds, whoever asks. The response is **identical** for
        unverified, verified and unknown emails, within the cooldown and when
        the email could not be queued.

        Rate limit: 6 requests per minute per IP address, whatever the email.
      security: []
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendVerificationRequest'
            examples:
              resend:
                summary: Resend the link
                value:
                  email: ivan@example.com
      responses:
        '200':
          description: Request accepted. The same body for every valid email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              examples:
                accepted:
                  summary: Unverified, verified and unknown emails alike
                  value:
                    message: If an unverified account exists for this email address, a new verification link will be sent.
        '422':
          description: The email is missing or malformed. Never reports unknown accounts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              examples:
                invalidEmail:
                  summary: Malformed email
                  value:
                    message: The email field must be a valid email address.
                    errors:
                      email:
                        - The email field must be a valid email address.
        '419':
          $ref: '#/components/responses/CsrfTokenMismatch'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'

  /v1/auth/social/{provider}/redirect:
    get:
      tags: [Social authentication]
      operationId: startSocialAuthentication
      x-implementation-status: contract-only
      x-implemented-in: BE-008
      summary: Start sign-in with a social provider
      description: |
        A top-level browser navigation (`window.location.assign`), never an
        XHR call. Generates the OAuth `state`, stores it together with the
        validated `intended` path and `remember` flag in a short-lived
        encrypted cookie, and redirects to the provider's consent screen.

        An `intended` value that is not a safe frontend path is replaced by
        `/` rather than rejected.

        Rate limit: 20 requests per minute per IP address.
      security: []
      parameters:
        - $ref: '#/components/parameters/SocialProvider'
        - name: intended
          in: query
          required: false
          description: |
            Frontend path to return to after sign-in, for example
            `/checkout`. Must start with a single `/`; absolute URLs,
            protocol-relative URLs (`//…`), backslashes, control characters
            and the auth pages themselves (`/login`, `/register`, `/auth/…`)
            are replaced by `/`. Maximum 2,048 characters.
          schema:
            type: string
            maxLength: 2048
          example: /checkout
        - name: remember
          in: query
          required: false
          description: Keep the customer signed in on this browser (as `remember` on login).
          schema:
            type: boolean
            default: false
          example: true
      responses:
        '302':
          description: Redirect to the provider's authorization page.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Set-Cookie:
              $ref: '#/components/headers/Set-Cookie'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /v1/auth/social/{provider}/callback:
    get:
      tags: [Social authentication]
      operationId: handleSocialCallback
      x-implementation-status: contract-only
      x-implemented-in: BE-008
      summary: OAuth callback for Google and Facebook (query response mode)
      description: |
        The provider redirects the browser here. The backend validates
        `state`, exchanges `code` for the provider identity, applies the
        account identity rules in `docs/api/authentication.md`, starts the
        session and **always** answers with a `303` redirect to the
        frontend, described by `x-frontend-redirect`. No provider or Aytos24
        token is ever placed in the redirect.

        Apple uses `POST` for this path; `GET` with `provider=apple` returns
        `404`.
      x-frontend-redirect:
        url: '{FRONTEND_URL}/auth/social/callback'
        query:
          type: object
          description: |
            Query parameters of the frontend URL that the social callback
            redirects to (`{FRONTEND_URL}/auth/social/callback`). They never
            contain tokens or personal data.
          required: [status, provider]
          properties:
            status:
              type: string
              enum: [success, error]
            provider:
              type: string
              enum: [google, facebook, apple]
            intended:
              type: string
              description: The validated `intended` path from the redirect endpoint, `/` by default.
            new_account:
              type: boolean
              description: With `status=success`, `true` when this sign-in created the customer account.
            error:
              type: string
              description: With `status=error`, the reason. See `docs/api/authentication.md`.
              enum:
                - cancelled
                - invalid_state
                - provider_error
                - email_missing
                - account_exists
      security: []
      parameters:
        - $ref: '#/components/parameters/QueryCallbackProvider'
        - name: code
          in: query
          required: false
          description: Authorization code. Absent when the provider reports an error.
          schema:
            type: string
        - name: state
          in: query
          required: false
          description: The `state` generated by the redirect endpoint.
          schema:
            type: string
        - name: error
          in: query
          required: false
          description: Provider error, e.g. `access_denied` when the customer cancels.
          schema:
            type: string
      responses:
        '303':
          description: Redirect to the frontend social callback page with the outcome.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Set-Cookie:
              $ref: '#/components/headers/Set-Cookie'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags: [Social authentication]
      operationId: handleSocialFormPostCallback
      x-implementation-status: contract-only
      x-implemented-in: BE-008
      summary: OAuth callback for Apple (form_post response mode)
      description: |
        Apple requires `response_mode=form_post` when the name or email
        scope is requested, so Apple posts the result here as a cross-site
        form submission. That request carries no session cookie
        (`SameSite=Lax`) and no CSRF token: it is excluded from CSRF
        verification and protected instead by the `state` cookie set with
        `SameSite=None; Secure`. The outcome is the same `303` redirect as
        the `GET` callback.

        `GET` and `POST` callbacks for Google and Facebook return `404` here.
      x-frontend-redirect:
        $ref: '#/paths/~1v1~1auth~1social~1{provider}~1callback/get/x-frontend-redirect'
      security: []
      parameters:
        - $ref: '#/components/parameters/FormPostCallbackProvider'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AppleCallbackForm'
            examples:
              firstSignIn:
                summary: First authorization (includes the user's name)
                value:
                  state: 3f6c1b2e9d8a4c7f
                  code: c1a2b3d4e5f6.0.abcd.EXAMPLE
                  id_token: eyJraWQiOiJFWEFNUExFIn0.eyJzdWIiOiIwMDEyMzQuZXhhbXBsZSJ9.c2lnbmF0dXJl
                  user: '{"name":{"firstName":"Ivan","lastName":"Totev"},"email":"x7k2p9@privaterelay.appleid.com"}'
              cancelled:
                summary: The customer cancelled
                value:
                  state: 3f6c1b2e9d8a4c7f
                  error: user_cancelled_authorize
      responses:
        '303':
          description: Redirect to the frontend social callback page with the outcome.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Set-Cookie:
              $ref: '#/components/headers/Set-Cookie'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /v1/me:
    get:
      tags: [Profile]
      operationId: getProfile
      x-implementation-status: contract-only
      x-implemented-in: BE-010
      summary: Get the customer's profile
      description: Returns the signed-in customer. Same representation as `GET /v1/auth/user`.
      security:
        - browserSession: []
        - nativeToken: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          $ref: '#/components/responses/Customer'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
    patch:
      tags: [Profile]
      operationId: updateProfile
      x-implementation-status: contract-only
      x-implemented-in: BE-010
      summary: Update the customer's profile
      description: |
        Partial update of the signed-in customer's own profile. There is no
        customer ID in the path: a customer can only ever change their own
        profile.

        | In the request body | Effect |
        | --- | --- |
        | field absent | unchanged |
        | `name`: string | trimmed and saved; `null` or empty is rejected |
        | `phone`: string | normalised to E.164 and saved |
        | `phone`: `null` or `""` | phone removed |
        | `email` or `password` present | `422` (`prohibited`): these change through dedicated flows |
        | any other field (e.g. `id`, `email_verified`) | ignored |

        An empty body `{}` is valid and returns the unchanged customer.

        Phone input may contain spaces, dashes, dots and parentheses. A
        leading `00` is read as `+`, and a leading single `0` as the
        Bulgarian country code `+359`. The result must be a valid E.164
        number (`+` and 8–15 digits), otherwise `422`.
      security:
        - browserSession: []
        - nativeToken: []
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
            examples:
              nameAndPhone:
                summary: Set name and phone
                value:
                  name: Ivan Totev
                  phone: '+359888123456'
              nationalPhone:
                summary: Bulgarian national format (saved as +359888123456)
                value:
                  phone: 0888 123 456
              removePhone:
                summary: Remove the phone number
                value:
                  phone: null
      responses:
        '200':
          description: The updated customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResource'
              examples:
                updated:
                  summary: Name and phone updated
                  value:
                    data:
                      id: 123
                      name: Ivan Totev
                      email: ivan@example.com
                      email_verified: true
                      phone: '+359888123456'
                      created_at: '2026-10-10T09:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '419':
          $ref: '#/components/responses/CsrfTokenMismatch'
        '422':
          description: Validation failed. `errors` names every invalid field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              examples:
                invalidPhone:
                  summary: Not a valid phone number
                  value:
                    message: The phone field must be a valid phone number.
                    errors:
                      phone:
                        - The phone field must be a valid phone number.
                emailProhibited:
                  summary: Attempt to change the email
                  value:
                    message: The email field is prohibited.
                    errors:
                      email:
                        - The email field is prohibited.
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'

components:
  parameters:
    CategoryFilter:
      name: category
      in: query
      required: false
      description: |
        Only return meals in the category with this slug. An unknown or
        inactive slug returns an empty result, not an error.
      schema:
        type: string
        minLength: 1
        maxLength: 100
        pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
      example: soups
    Search:
      name: search
      in: query
      required: false
      description: |
        Case-insensitive substring search in meal names and descriptions.
        Trimmed before validation; empty or whitespace-only values are
        ignored. Must be 2–100 characters after trimming.
      schema:
        type: string
        minLength: 2
        maxLength: 100
      example: мусака
    Page:
      name: page
      in: query
      required: false
      description: Page number, starting at 1.
      schema:
        type: integer
        minimum: 1
        default: 1
      example: 1
    PerPage:
      name: per_page
      in: query
      required: false
      description: Number of meals per page.
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
      example: 20
    XsrfToken:
      name: X-XSRF-TOKEN
      in: header
      required: false
      description: |
        Browser clients only: the URL-decoded value of the `XSRF-TOKEN`
        cookie set by `GET /sanctum/csrf-cookie`. Required on every
        state-changing browser request (Axios sends it automatically with
        `withCredentials` and `withXSRFToken`). Missing or stale values
        return `419`. Native clients using a bearer token omit it.
      schema:
        type: string
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: |
        Preferred language for messages in the response and for emails sent
        as a result of the request. Supported: `bg` and `en`; without a
        supported value the application default (`APP_LOCALE`, `bg` in
        production) is used. Response structure never depends on the
        language.
      schema:
        type: string
      example: bg
    SocialProvider:
      name: provider
      in: path
      required: true
      description: Social sign-in provider. Any other value returns `404`.
      schema:
        type: string
        enum: [google, facebook, apple]
      example: google
    QueryCallbackProvider:
      name: provider
      in: path
      required: true
      description: Providers that return to the callback with a `GET` (query response mode).
      schema:
        type: string
        enum: [google, facebook]
      example: google
    FormPostCallbackProvider:
      name: provider
      in: path
      required: true
      description: Providers that return to the callback with a `POST` (form_post response mode).
      schema:
        type: string
        enum: [apple]
      example: apple

  headers:
    X-RateLimit-Limit:
      description: Maximum number of requests allowed per minute.
      schema:
        type: integer
        minimum: 1
      example: 60
    X-RateLimit-Remaining:
      description: Requests remaining in the current one-minute window.
      schema:
        type: integer
        minimum: 0
      example: 59
    Retry-After:
      description: Seconds to wait before making another request.
      schema:
        type: integer
        minimum: 1
      example: 30
    Location:
      description: Absolute URL the browser is redirected to.
      schema:
        type: string
        format: uri
    Set-Cookie:
      description: |
        Session, `XSRF-TOKEN`, remember-me or OAuth state cookies. The
        session, remember-me and OAuth state cookies are `HttpOnly`; all are
        `Secure` in production. Their values are opaque to clients.
      schema:
        type: string

  responses:
    ValidationFailed:
      description: |
        One or more query parameters are invalid. `errors` contains an entry
        for every invalid parameter, keyed by parameter name.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
          examples:
            perPageTooLarge:
              summary: per_page above the maximum
              value:
                message: The per page field must not be greater than 50.
                errors:
                  per_page:
                    - The per page field must not be greater than 50.
            multipleFields:
              summary: Several invalid parameters
              value:
                message: The category field format is invalid. (and 1 more error)
                errors:
                  category:
                    - The category field format is invalid.
                  page:
                    - The page field must be an integer.
    TooManyRequests:
      description: The client exceeded the rate limit.
      headers:
        Retry-After:
          $ref: '#/components/headers/Retry-After'
        X-RateLimit-Limit:
          $ref: '#/components/headers/X-RateLimit-Limit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/X-RateLimit-Remaining'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RateLimitError'
          examples:
            tooManyAttempts:
              summary: Rate limit exceeded
              value:
                message: Too Many Attempts.
    ServerError:
      description: |
        An unexpected error occurred. The body never contains stack traces,
        exception details or other internal information.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ServerError'
          examples:
            serverError:
              summary: Unexpected server error
              value:
                message: Server Error
    ServiceUnavailable:
      description: The API is temporarily unavailable, for example during maintenance.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ServerError'
          examples:
            maintenance:
              summary: Maintenance mode
              value:
                message: Service Unavailable
    Customer:
      description: The authenticated customer.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CustomerResource'
          examples:
            customer:
              summary: Verified customer without a phone number
              value:
                data:
                  id: 123
                  name: Ivan
                  email: ivan@example.com
                  email_verified: true
                  phone: null
                  created_at: '2026-10-10T09:00:00Z'
    Unauthenticated:
      description: |
        No valid session or token: never signed in, signed out, or the
        session or token expired or was revoked. The client should treat the
        customer as signed out.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            unauthenticated:
              summary: Not signed in
              value:
                message: Unauthenticated.
    CsrfTokenMismatch:
      description: |
        Browser clients only: the `X-XSRF-TOKEN` header is missing or does
        not match the session (for example because the session expired).
        Call `GET /sanctum/csrf-cookie` and retry the request once.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            csrfMismatch:
              summary: Missing or stale CSRF token
              value:
                message: CSRF token mismatch.
    NotFound:
      description: Unknown or unsupported provider, or the provider does not use this HTTP method.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            notFound:
              summary: Unsupported provider
              value:
                message: Not Found

  schemas:
    MealCollection:
      type: object
      description: A page of meals with pagination metadata.
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Meal'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    Meal:
      type: object
      description: A dish on a restaurant's daily lunch menu.
      required:
        - id
        - name
        - description
        - portion
        - price
        - image_url
        - available_on
        - served_from
        - served_until
        - category
        - restaurant
      properties:
        id:
          type: integer
          minimum: 1
          description: Unique meal identifier.
          examples: [1042]
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Dish name as shown on the menu.
          examples: [Мусака]
        description:
          type: [string, 'null']
          maxLength: 1000
          description: Optional dish description or ingredients.
          examples: [Класическа мусака с картофи и кайма.]
        portion:
          type: [string, 'null']
          maxLength: 50
          description: |
            Portion size as written on the restaurant's menu (for example
            `400 г` or `350 мл`), or `null` if not provided. Free text;
            not normalised.
          examples: [400 г]
        price:
          $ref: '#/components/schemas/Price'
        image_url:
          type: [string, 'null']
          format: uri
          description: Absolute URL of a dish photo, or `null` if there is none.
        available_on:
          type: string
          format: date
          description: The restaurant-local date this meal is offered on (`YYYY-MM-DD`).
          examples: ['2026-10-09']
        served_from:
          type: [string, 'null']
          format: date-time
          description: |
            Start of the serving window, RFC 3339 with the restaurant's UTC
            offset. `null` when the restaurant has not specified one.
          examples: ['2026-10-09T11:30:00+03:00']
        served_until:
          type: [string, 'null']
          format: date-time
          description: |
            End of the serving window, RFC 3339 with the restaurant's UTC
            offset. `null` when the restaurant has not specified one. The
            meal stays listed after this time until local midnight.
          examples: ['2026-10-09T15:00:00+03:00']
        category:
          $ref: '#/components/schemas/MealCategory'
        restaurant:
          $ref: '#/components/schemas/RestaurantSummary'

    MealCategory:
      type: object
      description: |
        A meal category used for filtering. Only active categories appear in
        responses.
      required: [id, slug, name]
      properties:
        id:
          type: integer
          minimum: 1
          examples: [1]
        slug:
          type: string
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          maxLength: 100
          description: Stable identifier used in the `category` query parameter.
          examples: [soups]
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Display name.
          examples: [Супи]

    RestaurantSummary:
      type: object
      description: The restaurant that offers a meal (restaurant attribution).
      required: [id, slug, name, address, logo_url, timezone]
      properties:
        id:
          type: integer
          minimum: 1
          examples: [7]
        slug:
          type: string
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          maxLength: 255
          description: Stable URL-friendly identifier.
          examples: [bistro-aetos]
        name:
          type: string
          minLength: 1
          maxLength: 255
          examples: [Бистро Аетос]
        address:
          type: [string, 'null']
          maxLength: 255
          description: Street address, or `null` if not provided.
          examples: [ул. Цар Освободител 12, Айтос]
        logo_url:
          type: [string, 'null']
          format: uri
          description: Absolute URL of the restaurant logo, or `null`.
        timezone:
          type: string
          description: |
            IANA time zone the restaurant operates in. Determines what
            "today" means for its meals and the offset of its timestamps.
          examples: [Europe/Sofia]

    Price:
      type: object
      description: A monetary amount in integer minor units.
      required: [amount, currency]
      properties:
        amount:
          type: integer
          minimum: 0
          description: Amount in euro cents (e.g. `690` = €6.90).
          examples: [690]
        currency:
          type: string
          const: EUR
          description: ISO 4217 currency code. Always `EUR`.

    PaginationMeta:
      type: object
      description: Pagination metadata for a list response.
      required: [current_page, per_page, total, last_page]
      properties:
        current_page:
          type: integer
          minimum: 1
          description: The requested page number.
          examples: [1]
        per_page:
          type: integer
          minimum: 1
          maximum: 50
          description: The page size used for this response.
          examples: [20]
        total:
          type: integer
          minimum: 0
          description: Total number of matching meals across all pages.
          examples: [0]
        last_page:
          type: integer
          minimum: 1
          description: Number of the last page. `1` when there are no results.
          examples: [1]

    ValidationError:
      type: object
      description: Returned with `422` when request parameters fail validation.
      required: [message, errors]
      properties:
        message:
          type: string
          description: |
            Summary of the first error, with a count of any others. For
            display or logging only; use `errors` to identify fields.
        errors:
          type: object
          description: |
            Map of invalid field name to one or more error messages for that
            field.
          minProperties: 1
          additionalProperties:
            type: array
            minItems: 1
            items:
              type: string

    RateLimitError:
      type: object
      description: Returned with `429` when the client exceeds the rate limit.
      required: [message]
      properties:
        message:
          type: string
          description: Human-readable explanation. See the `Retry-After` header.

    ServerError:
      type: object
      description: |
        Returned with `5xx` status codes. Contains only a generic message;
        no stack traces or implementation details.
      required: [message]
      properties:
        message:
          type: string
          description: Generic human-readable error message.

    Customer:
      type: object
      description: |
        The customer representation used by every authentication and profile
        endpoint. It deliberately contains no password hash, remember-me
        token, OAuth token, linked provider identifiers or other security
        metadata. Fields are never added without updating this contract.
      additionalProperties: false
      required: [id, name, email, email_verified, phone, created_at]
      properties:
        id:
          type: integer
          minimum: 1
          description: Customer identifier.
          examples: [123]
        name:
          type: [string, 'null']
          minLength: 1
          maxLength: 255
          description: |
            Display name. Always set for email registrations. `null` only for
            social sign-ins where the provider shared no name (possible with
            Apple); the client should ask for it with `PATCH /v1/me`.
          examples: [Ivan]
        email:
          type: string
          format: email
          maxLength: 255
          description: |
            Sign-in and contact email, lowercased. May be an Apple private
            relay address (`…@privaterelay.appleid.com`).
          examples: [ivan@example.com]
        email_verified:
          type: boolean
          description: Whether the customer has proven ownership of `email`.
        phone:
          type: [string, 'null']
          pattern: '^\+[1-9][0-9]{7,14}$'
          description: Phone number in E.164 format, or `null` if not provided.
          examples: ['+359888123456']
        created_at:
          type: string
          format: date-time
          pattern: 'Z$'
          description: When the account was created, RFC 3339 in UTC.
          examples: ['2026-10-10T09:00:00Z']

    CustomerResource:
      type: object
      description: A single customer wrapped in `data`.
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Customer'

    RegisterRequest:
      type: object
      required: [name, email, password, password_confirmation]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Trimmed before validation.
        email:
          type: string
          format: email
          maxLength: 255
          description: Trimmed and lowercased; must not belong to an existing customer.
        password:
          $ref: '#/components/schemas/NewPassword'
        password_confirmation:
          type: string
          description: Must equal `password`.
        remember:
          type: boolean
          default: false
          description: Keep the customer signed in on this browser.

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          minLength: 1
          description: Checked only against the stored hash; the password policy is not applied at login.
        remember:
          type: boolean
          default: false
          description: Keep the customer signed in on this browser after the idle session expires.

    RegistrationAccepted:
      type: object
      description: The account exists; the customer must verify the email before signing in.
      required: [message, verification_required]
      additionalProperties: false
      properties:
        message:
          type: string
          description: For display only.
        verification_required:
          const: true

    EmailNotVerified:
      type: object
      description: Correct credentials, but the email is not verified yet.
      required: [message, code]
      additionalProperties: false
      properties:
        message:
          type: string
          description: For display only.
        code:
          const: EMAIL_NOT_VERIFIED

    ResendVerificationRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 255

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 255

    ResetPasswordRequest:
      type: object
      required: [email, token, password, password_confirmation]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        token:
          type: string
          minLength: 1
          maxLength: 255
          description: The `token` query parameter of the reset link.
        password:
          $ref: '#/components/schemas/NewPassword'
        password_confirmation:
          type: string
          description: Must equal `password`.

    NewPassword:
      type: string
      minLength: 8
      maxLength: 128
      description: |
        Password policy: 8–128 characters, at least one letter and one
        digit, and (in production) not found in known data breaches
        (Have I Been Pwned k-anonymity check).

    UpdateProfileRequest:
      type: object
      description: |
        Partial update. Absent fields are unchanged; `email` and `password`
        are prohibited; other unknown fields are ignored.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Trimmed before validation. Cannot be removed.
        phone:
          type: [string, 'null']
          maxLength: 32
          description: Any common notation; normalised to E.164. `null` or `""` removes it.

    AppleCallbackForm:
      type: object
      description: Fields Apple posts to the callback (`response_mode=form_post`).
      required: [state]
      properties:
        state:
          type: string
        code:
          type: string
          description: Authorization code, absent on error.
        id_token:
          type: string
          description: Apple identity token (JWT) with `sub`, `email` and `email_verified`.
        user:
          type: string
          description: |
            JSON with the customer's name and email. Sent **only on the first
            authorization** of Aytos24 by this Apple ID.
        error:
          type: string
          description: '`user_cancelled_authorize` when the customer cancels.'

    Message:
      type: object
      description: A confirmation with a human-readable `message`.
      required: [message]
      additionalProperties: false
      properties:
        message:
          type: string
          description: For display only; clients branch on the HTTP status.

    ErrorMessage:
      type: object
      description: A non-validation error with a human-readable `message`.
      required: [message]
      properties:
        message:
          type: string
          description: For display or logging only; clients branch on the HTTP status.

  securitySchemes:
    browserSession:
      type: apiKey
      in: cookie
      name: aytos24_session
      description: |
        Laravel Sanctum stateful (SPA) authentication for the Vue web app:
        an `HttpOnly`, `Secure`, `SameSite=Lax` session cookie, plus the
        `X-XSRF-TOKEN` header on state-changing requests. Requires a request
        from an origin listed in `SANCTUM_STATEFUL_DOMAINS` with credentials
        included. The cookie is set by `GET /sanctum/csrf-cookie`, register,
        login and the social callback; it is never read by JavaScript.
    nativeToken:
      type: http
      scheme: bearer
      description: |
        Future Capacitor apps: a Sanctum personal access token in the
        `Authorization: Bearer` header, kept in secure device storage.
        Token issuance is not part of this contract version.
